<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="base_v.css"><script src="engine.js"></script>
<style>
body { background: #07070A; }
#flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; z-index: 40; background: #FFFFFF; }
.brk { position: absolute; left: 28px; top: 100px; display: flex; align-items: center; gap: 10px; z-index: 6; }
.brk .b { color: #fff; font-weight: 800; font-size: 15px; letter-spacing: 0.16em; padding: 6px 12px; border-radius: 4px; }
.brk .d { font-family: 'Geist Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: #E5E7EB; border: 1px solid #374151; padding: 5px 10px; border-radius: 4px; }
.src { position: absolute; left: 28px; right: 28px; top: 140px; font-size: 9.5px; color: #6B7280; line-height: 1.4; }
.tape { position: absolute; left: 0; right: 0; top: 640px; height: 34px; overflow: hidden; z-index: 6; }
.tape .tin { position: absolute; top: 0; white-space: nowrap; font-family: 'Geist Mono', monospace; font-size: 14px; line-height: 34px; }
.k { font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.22em; color: #9CA3AF; }
.blk { position: absolute; left: 28px; right: 28px; top: 230px; }
.huge { font-family: 'Geist Mono', monospace; font-size: 96px; font-weight: 500; letter-spacing: -0.05em; line-height: 1; margin-top: 10px; white-space: nowrap; }
.sub { font-size: 24px; font-weight: 700; margin-top: 12px; line-height: 1.25; }
.card { background: #12121A; border: 1px solid #1F2937; border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; }
.card .v { font-family: 'Geist Mono', monospace; font-size: 46px; letter-spacing: -0.04em; margin-top: 6px; line-height: 1.05; }
.card .n { font-size: 14px; color: #9CA3AF; margin-top: 6px; line-height: 1.35; }
.cal { border: 2px solid #A855F7; background: #140F1F; }
.cal .v { color: #C4B5FD; font-size: 34px; }
.hl { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; margin-top: 12px; }
.bar { height: 30px; border-radius: 6px; margin-top: 12px; display: flex; align-items: center; padding: 0 12px; font-family: 'Geist Mono', monospace; font-size: 13px; letter-spacing: 0.12em; color: #fff; transform-origin: left; white-space: nowrap; }
.lvl { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px dashed #374151; }
.lvl:last-child { border-bottom: 0; }
.lvl .v { font-family: 'Geist Mono', monospace; font-size: 40px; letter-spacing: -0.03em; }
.qt { font-size: 32px; font-weight: 700; line-height: 1.25; border-left: 4px solid #00E0C6; padding-left: 18px; margin-top: 14px; }
.ag { background: #0F0F16; border: 1px solid #2A2F37; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; font-family: 'Geist Mono', monospace; font-size: 15px; line-height: 1.5; }
.ag .who { font-size: 11px; letter-spacing: 0.2em; color: #A855F7; }
.ok { color: #22C55E; } .no { color: #EF4444; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.chips span { border: 1px solid #00E0C6; color: #E5FFFB; border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 600; background: #0B1716; }
.end { position: absolute; inset: 0; background: #0A0A0F; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; opacity: 0; padding: 0 28px; }
.end img { height: 46px; }
.end .t { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; margin-top: 24px; line-height: 1.1; }
.end .t span { color: #00E0C6; }
.end .url { font-family: 'Geist Mono', monospace; font-size: 18px; border: 1px solid #00E0C6; border-radius: 9px; padding: 8px 20px; margin-top: 24px; }
.end .f { font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.22em; color: #9CA3AF; margin-top: 28px; }
.end .fine { position: absolute; left: 28px; right: 28px; bottom: 200px; font-size: 10px; color: #6B7280; }
</style></head>
<body>
<div id="cam" data-zoom="0.03">
  <div class="top"><img src="logo.png" alt="99X"><div class="series" id="series"></div></div>
  <div class="brk"><div class="b" id="badge"></div><div class="d" id="date"></div></div>
  <div class="src" id="src"></div>
  <div id="beats"></div>
</div>
<div class="tape" id="tapeW"><div class="tin" id="tape"></div></div>
<div class="end" id="end">
  <img src="logo.png" alt="99X">
  <div class="t">Trade with AI.<br><span>Stay in control.</span></div>
  <div class="url">99x.exchange</div>
  <div class="f" id="endf"></div>
  <div class="fine">not financial advice · leverage trading involves substantial risk</div>
</div>
<div id="flash"></div>
<div id="cap"></div><div id="veil"></div>
<script>
// Episode template. window.EP (episode JSON) and window.SCENE are injected by make.py.
const COL = { red: '#EF4444', green: '#22C55E', teal: '#00E0C6', amber: '#FCD34D', purple: '#C4B5FD', white: '#FFFFFF', grey: '#9CA3AF' };
const col = c => COL[c] || c || '#FFFFFF';
const CT = (i, end, off) => SCENE.lead + (end ? SCENE.chunks[i].end : SCENE.chunks[i].start) + (off || 0);
const clamp = x => Math.min(1, Math.max(0, x)), ease = x => 1 - Math.pow(1 - clamp(x), 3);
const $ = id => document.getElementById(id);
function el(tag, cls, text, style) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; if (style) e.setAttribute('style', style); return e; }
function anim(e, at, a, d) { e.dataset.in = at; e.dataset.a = a || 'up'; if (d) e.dataset.d = d; return e; }
// item i of n inside beat b appears at: beat start + 0.5 + i * step (make.py uses the same rule for sound)
function stepOf(b, n) { const dur = (b + 1 < SCENE.chunks.length ? SCENE.chunks[b + 1].start : SCENE.chunks[b].end) - SCENE.chunks[b].start; return Math.min(2.0, Math.max(0.5, (dur - 1.0) / Math.max(n, 1))); }
const COUNTERS = [], BARS = [];
let built = false;
function build() {
  const EP = window.EP, root = $('beats');
  $('series').textContent = '[ ' + (EP.series || 'DAILY BRIEF') + ' ]';
  $('badge').textContent = EP.badge || 'BREAKING';
  $('badge').style.background = col(EP.badgeColor || 'red');
  $('date').textContent = EP.date || '';
  $('src').textContent = EP.src || '';
  $('endf').textContent = EP.follow || 'FOLLOW FOR THE DAILY BRIEF';
  const tc = EP.tapeColor === 'teal' ? ['#0B1716', '#134E48', '#99F6E4'] : EP.tapeColor === 'purple' ? ['#140F1F', '#4C1D95', '#DDD6FE'] : ['#1A0B0D', '#7F1D1D', '#FCA5A5'];
  $('tapeW').style.cssText += `background:${tc[0]}; border-top:1px solid ${tc[1]}; border-bottom:1px solid ${tc[1]};`;
  const T1 = (EP.tape || []).join('   ·   ') + '   ·   ';
  $('tape').style.color = tc[2];
  $('tape').innerHTML = '';
  const t1 = el('span', null, T1); t1.id = 't1'; $('tape').append(t1, el('span', null, T1), el('span', null, T1));
  const nb = EP.beats.length;
  EP.beats.forEach((B, b) => {
    const out = 'c' + (b + 1) + '-0.05';
    const blk = el('div', 'blk'); blk.dataset.in = (b === 0 ? '0.05' : 'c' + b + '-0.05'); blk.dataset.a = b === 0 ? 'pop' : 'up'; blk.dataset.d = b === 0 ? '0.3' : '0.45'; blk.dataset.out = out;
    if (B.k) blk.append(el('div', 'k', B.k, 'margin-bottom:10px'));
    const items = B.items || B.rows || [];
    const step = () => stepOf(b, items.length);
    if (B.type === 'hero') {
      const h = el('div', 'huge', '', `color:${col(B.color)}`); blk.append(h);
      COUNTERS.push({ e: h, b, from: B.from != null ? B.from : 0, to: B.to, pre: B.prefix || '', suf: B.suffix || '', dec: B.dec || 0, text: B.text });
      if (B.sub) blk.append(el('div', 'sub', B.sub));
    } else if (B.type === 'headline') {
      blk.append(el('div', 'hl', B.text, `color:${col(B.color || 'white')}`));
      if (B.sub) blk.append(anim(el('div', 'sub', B.sub, 'color:#D1D5DB; font-weight:600; font-size:20px'), 'c' + b + '+1.2'));
      items.forEach((it, i) => { const c = el('div', 'card', null, 'margin-top:14px'); c.append(el('div', 'k', it.k), el('div', 'v', it.v, `color:${col(it.color)}; font-size:36px`)); if (it.n) c.append(el('div', 'n', it.n)); blk.append(anim(c, 'c' + b + '+' + (1.8 + i * 1.2).toFixed(2))); });
    } else if (B.type === 'cards' || B.type === 'list') {
      items.forEach((it, i) => {
        const c = el('div', B.type === 'list' ? 'card cal' : 'card', null, B.color ? `border:2px solid ${col(B.color)}` : '');
        c.append(el('div', 'k', it.k), el('div', 'v', it.v, B.type === 'list' ? '' : `color:${col(it.color)}`));
        if (it.n) c.append(el('div', 'n', it.n));
        blk.append(anim(c, 'c' + b + '+' + (0.5 + i * stepOf(b, items.length)).toFixed(2)));
      });
    } else if (B.type === 'bars') {
      if (B.v) blk.append(el('div', 'huge', B.v, `color:${col(B.color || 'white')}; font-size:76px`));
      items.forEach(it => { const r = el('div', 'bar', `${it.label}`, `background:${col(it.color)}; width:${Math.max(26, it.pct)}%`); blk.append(r); BARS.push({ e: r, b }); });
      if (B.note) blk.append(el('div', 'n', B.note, 'font-size:12px; color:#6B7280; margin-top:12px'));
    } else if (B.type === 'levels') {
      const c = el('div', 'card'); blk.append(c);
      items.forEach((it, i) => { const r = el('div', 'lvl'); r.append(el('span', 'k', it.k), el('span', 'v', it.v, `color:${col(it.color)}`)); c.append(anim(r, 'c' + b + '+' + (0.4 + i * stepOf(b, items.length)).toFixed(2))); });
    } else if (B.type === 'quote') {
      blk.append(el('div', 'qt', '“' + B.text + '”'));
      if (B.who) blk.append(anim(el('div', 'k', '— ' + B.who, 'margin-top:14px'), 'c' + b + '+1.0'));
    }
    root.append(blk);
  });
  // closing pitch: 2 voice chunks after the beats, then the follow line
  const p = el('div', 'blk'); p.dataset.in = 'c' + nb; p.dataset.a = 'up'; p.dataset.out = 'c' + (nb + 2) + '-0.05';
  p.append(el('div', 'sub', '', 'font-size:30px; margin:0 0 14px'));
  p.lastChild.innerHTML = 'Trade with <span style="color:#00E0C6">AI agents</span> on 99X.';
  const a1 = el('div', 'ag'); a1.innerHTML = '<div class="who">AGENT ▸ ORDER</div>long BTC 0.01 · max 5× · stop −3%<br><span class="ok">✓ risk check passed · filled</span>';
  const a2 = el('div', 'ag'); a2.innerHTML = '<div class="who">AGENT ▸ WITHDRAW</div>withdraw all USDC<br><span class="no">✕ DENIED · agent keys can\'t withdraw</span>';
  const ch = el('div', 'chips'); ['your rules', 'your limits', 'no withdrawal access'].forEach((s, i) => ch.append(anim(el('span', null, s), 'c' + (nb + 1) + '+' + (0.5 * i).toFixed(1), 'pop')));
  p.append(anim(a1, 'c' + nb + '+1.0'), anim(a2, 'c' + (nb + 1) + '+1.3'), ch);
  root.append(p);
  built = true;
}
function spike(t, at, a, d) { return t >= at ? a * Math.max(0, 1 - (t - at) / d) : 0; }
let TW = 0;
const base0 = window.renderAt;
window.renderAt = function (t) {
  if (!built) build();
  base0(t);
  if (!TW) TW = $('t1').getBoundingClientRect().width || 1400;
  $('tape').style.transform = `translateX(${(-(t * 70) % TW).toFixed(1)}px)`;
  $('badge').style.opacity = (0.65 + 0.35 * (Math.sin(t * 8) > 0 ? 1 : 0)).toFixed(2);
  COUNTERS.forEach(c => {
    if (c.to == null) { c.e.textContent = c.text || ''; return; }
    const q = ease((t - CT(c.b, false, 0.15)) / 1.4), v = c.from + (c.to - c.from) * q;
    c.e.textContent = c.pre + v.toLocaleString('en-US', { minimumFractionDigits: c.dec, maximumFractionDigits: c.dec }) + c.suf;
  });
  BARS.forEach(r => r.e.style.transform = `scaleX(${ease((t - CT(r.b, false, 0.5)) / 0.8)})`);
  const nb = window.EP.beats.length;
  $('flash').style.opacity = spike(t, 0.05, 0.3, 0.3).toFixed(3);
  const sh = spike(t, 0.05, 5, 0.35);
  $('cam').style.transform += ` translate(${(Math.sin(t * 90) * sh).toFixed(2)}px, ${(Math.cos(t * 77) * sh).toFixed(2)}px)`;
  $('end').style.opacity = clamp((t - CT(nb + 2, false, -0.1)) / 0.2).toFixed(3);
};
</script>
<script src="captions.js"></script>
</body></html>
